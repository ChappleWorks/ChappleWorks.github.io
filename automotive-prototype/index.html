<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeoNet Automotive</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#07121b;color:#e8f4fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#153c50 0%,#07121b 60%)}
header{padding:22px 5%;border-bottom:1px solid #235369}.logo{font-size:25px;font-weight:850;font-style:italic;letter-spacing:-.7px}.logo span{color:#ff991e}
main{flex:1;width:min(1020px,92%);margin:auto;display:flex;flex-direction:column;justify-content:center;padding:65px 0}
h1{font-size:clamp(30px,5vw,55px);letter-spacing:-1.5px;margin:0 0 32px;text-align:center}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
nav a{display:flex;align-items:center;justify-content:center;min-height:190px;border:1px solid #2c657d;border-radius:20px;background:linear-gradient(145deg,#17384b,#0b1b29);color:#fff;text-decoration:none;font-size:clamp(24px,3vw,33px);font-weight:750;box-shadow:0 14px 30px #0004;transition:transform .15s,border-color .15s}
nav a:hover,nav a:focus-visible{border-color:#ff991e;transform:translateY(-3px);outline-offset:4px}
footer{text-align:center;padding:20px;color:#8aaebd;font-size:12px}
@media(max-width:600px){nav{grid-template-columns:1fr;gap:12px}nav a{min-height:110px}main{padding:35px 0}}
</style></head><body><header><div class="logo">LeoNet <span>Automotive</span></div></header><main><h1>Choose a department</h1><nav aria-label="Departments"><a href="workspace.html?section=sales">Sales</a><a href="workspace.html?section=service">Service</a><a href="workspace.html?section=customer">Customer</a><a href="https://chappleworks.github.io/vehicle-intelligence-dev/">Auction</a></nav></main><footer>LeoNet Automotive</footer></body></html>

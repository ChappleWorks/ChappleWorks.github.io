<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeoNet Automotive — Flow Prototype</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#e8f4fa;background:#07121b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:linear-gradient(110deg,#101c28,#07121b 65%,#103047);border-bottom:1px solid #0f7a9d}.logo{font-size:27px;font-weight:850;font-style:italic;letter-spacing:-1px}.logo span{color:#ff991e}.sub{color:#8daab9;font-size:12px}.layout{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 76px)}aside{background:#091823;border-right:1px solid #19475a;padding:20px 12px}aside button{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:5px;background:transparent;border:1px solid transparent;border-radius:9px;color:#b7d3df}aside button.active{background:#08384e;color:#fff;border-color:#04b9e5;box-shadow:inset 3px 0 #05d4fc}main{padding:24px;max-width:1550px;width:100%;margin:auto}h1{margin:0 0 6px;font-size:29px}h2{font-size:18px;margin:0 0 15px}p{color:#9ab5c3;margin:4px 0 18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}.card{background:linear-gradient(145deg,#102533,#091b28);border:1px solid #16627c;border-radius:13px;padding:18px;min-width:0}.grid{display:grid;gap:15px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{font-size:29px;font-weight:800}.muted{color:#8fa9b7;font-size:13px}.orange{color:#ff9a22}.cyan{color:#38d8fa}.button{background:#06384d;border:1px solid #0fc5e9;border-radius:9px;padding:10px 14px;color:#e7faff}.button.primary{background:#ef870c;border-color:#ff9d25;color:#08131b;font-weight:750}.button.ghost{background:transparent;border-color:#3d6475}.button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#091722;color:#f3fbff;border:1px solid #396071;border-radius:8px;padding:11px;margin:6px 0 12px}label{font-size:12px;color:#9fbdca}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 9px;border-bottom:1px solid #234354;font-size:13px}th{color:#89b9c9;font-weight:600}.tag{font-size:11px;border-radius:7px;padding:5px 8px;background:#124255;color:#76e4fb;display:inline-block}.tag.warn{background:#503716;color:#ffbf58}.tag.ok{background:#174333;color:#68ecac}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{padding:10px 0;border-bottom:1px solid #254355}.line:last-child{border-bottom:0}.item{cursor:pointer}.item:hover{background:#15384b}.notice{border-left:3px solid #ff9c22;padding:10px 14px;background:#352719;color:#e7c79e;font-size:13px;margin-bottom:18px}.small{font-size:12px}.hidden{display:none}.empty{padding:30px;color:#8da7b4;text-align:center}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar input{max-width:380px;margin:0}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow b{background:#12384a;border:1px solid #28708b;padding:10px;border-radius:8px;font-size:12px}.flow span{color:#3acbea}.card table{display:block;overflow:auto;max-height:520px}.card table thead{position:sticky;top:0;background:#102533}.status{margin-top:12px;font-size:12px;color:#82e3ae;min-height:18px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px}aside button{white-space:nowrap;width:auto}.two,.three,.four,.split{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}main{padding:16px}}
</style></head><body><header><div><div class="logo">LeoNet <span>Automotive</span></div><div class="sub">INTERACTIVE FLOW PROTOTYPE · FIRST PASS</div></div><div class="sub">DEMO DATA ONLY · NO LIVE CRM OR PAYMENTS</div></header><div class="layout"><aside id="nav"></aside><main><div id="app"></div></main></div><script>
const starter={customers:[{id:'C-001',name:'Jordan Miller',phone:'555-0101',email:'jordan@example.test'},{id:'C-002',name:'Taylor Ruiz',phone:'555-0102',email:'taylor@example.test'}],vehicles:[{id:'V-001',vin:'1C6SRFFT9KN736201',year:'2019',make:'Ram',model:'1500',engine:'5.7L V8',customerId:'C-001',miles:'87430',purpose:'Service'},{id:'V-002',vin:'1G4CYN EY4MF162789'.replace(/ /g,''),year:'2021',make:'Chevrolet',model:'Silverado 2500HD',engine:'6.6L',customerId:'C-002',miles:'42000',purpose:'Service'}],inventory:[{id:'ST-101',vehicleId:'V-001',price:'24900',status:'Available'}],orders:[{id:'RO-1001',vehicleId:'V-001',customerId:'C-001',work:'Oil change & inspection',status:'In Progress'}],parts:[{id:'P-1001',orderId:'RO-1001',item:'Oil filter',status:'Requested'}],invoices:[{id:'INV-1001',orderId:'RO-1001',amount:'125.00',status:'Draft'}]};

function demoData(){
 const first=['Jordan','Taylor','Alex','Morgan','Casey','Jamie','Drew','Avery','Riley','Cameron','Parker','Reese','Skyler','Quinn','Dakota','Hayden','Blake','Rowan','Emerson','Logan'];
 const last=['Miller','Ruiz','Johnson','Smith','Williams','Brown','Davis','Garcia','Wilson','Martinez','Anderson','Thomas','Moore','Jackson','White'];
 const models=[['Ford','F-150'],['Chevrolet','Silverado 1500'],['Ram','1500'],['Toyota','Camry'],['Honda','Civic'],['GMC','Sierra 1500'],['Jeep','Wrangler'],['Nissan','Altima'],['Hyundai','Tucson'],['Toyota','Tacoma'],['Ford','Explorer'],['Chevrolet','Equinox']];
 const customers=Array.from({length:100},(_,i)=>({id:'C-'+String(i+1).padStart(3,'0'),name:first[i%first.length]+' '+last[Math.floor(i/first.length)%last.length],phone:'555-'+String(1000+i),email:'customer'+(i+1)+'@example.test'}));
 const vehicles=Array.from({length:120},(_,i)=>{const [make,model]=models[i%models.length];return {id:'V-'+String(i+1).padStart(3,'0'),vin:'DEMO'+String(i+1).padStart(13,'0'),year:String(2015+(i%12)),make,model,engine:'Demo specification',customerId:i<70?customers[i%100].id:'',miles:String(9000+(i*1847)%150000),purpose:i<100?'Inventory':'Service'}});
 const inventory=vehicles.slice(0,100).map((v,i)=>({id:'ST-'+String(i+1).padStart(3,'0'),vehicleId:v.id,price:String(11900+(i*1379)%48000),status:i%11===0?'Sold':i%7===0?'Reserved':'Available'}));
 const technicians=[{id:'T-001',name:'Alex Rivera'},{id:'T-002',name:'Sam Carter'},{id:'T-003',name:'Morgan Lee'}];
 const jobs=['Oil change and inspection','Brake inspection','Check engine light diagnosis','Windshield replacement','A/C diagnostic','Tire service','Suspension inspection','Battery replacement'];
 const orders=Array.from({length:18},(_,i)=>({id:'RO-'+String(1001+i),vehicleId:vehicles[100+i].id,customerId:customers[i].id,work:jobs[i%jobs.length],status:['Requested','Authorized','In Progress','Ready','Closed'][i%5],technicianId:i%6===0?'':technicians[i%3].id}));
 const parts=orders.slice(0,8).map((o,i)=>({id:'P-'+String(1001+i),orderId:o.id,item:['Oil filter','Brake pads','Windshield','Cabin filter'][i%4],status:['Requested','Ordered','Received','Installed'][i%4]}));
 const invoices=orders.slice(0,12).map((o,i)=>({id:'INV-'+String(1001+i),orderId:o.id,amount:(89+i*47).toFixed(2),status:['Draft','Issued','Paid (demo)'][i%3]}));
 return {customers,vehicles,inventory,technicians,orders,parts,invoices};
}
let db;try{db=JSON.parse(localStorage.getItem('leonet_auto_flow_v1'))||structuredClone(starter)}catch{db=structuredClone(starter)};if(!db.technicians)db.technicians=[];let page='Dashboard',selectedVehicle=null;const pages=['Dashboard','Customers & Vehicles','Inventory & Sales','Service','Parts & Glass','Invoices','Management'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem('leonet_auto_flow_v1',JSON.stringify(db))};const vehicle=id=>db.vehicles.find(x=>x.id===id),customer=id=>db.customers.find(x=>x.id===id);const vlabel=id=>{let v=vehicle(id);return v?`${v.year} ${v.make} ${v.model}`:'Unknown vehicle'};const btn=(name,fn,cls='')=>`<button class="button ${cls}" onclick="${fn}">${name}</button>`;const wrap=(title,desc,body,action='')=>`<div class="head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${action}</div></div>${body}<div class="status" id="status"></div>`;const box=(title,body)=>`<div class="card"><h2>${title}</h2>${body}</div>`;const options=(rows,selected)=>rows.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.label)}</option>`).join('');const formfield=(label,id,val='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(val)}"></label>`;
function go(p){page=p;render()}function message(s){if($('status'))$('status').textContent=s}function reset(){if(confirm('Reset prototype demo data?')){db=structuredClone(starter);save();selectedVehicle=null;render()}}function loadDemo(){if(!confirm('Load 100 customers, 100 inventory vehicles, 3 technicians and sample work orders? This replaces the current local prototype records.'))return;db=demoData();selectedVehicle=null;save();render();message('Demo dealership loaded.')}function render(){ $('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('')+`<button onclick="reset()" style="margin-top:35px">↻ Reset demo data</button>`;let html='';if(page==='Dashboard')html=dashboard();if(page==='Customers & Vehicles')html=customers();if(page==='Inventory & Sales')html=inventory();if(page==='Service')html=service();if(page==='Parts & Glass')html=parts();if(page==='Invoices')html=invoices();if(page==='Management')html=management();$('app').innerHTML=html}
function dashboard(){return wrap('Dealership Dashboard','One entry point to the operating workflow.',`<div class="notice">First-pass prototype: all records are fictional and stored in this browser. Use “Load 100-record demo” in the sidebar to explore a populated dealership. This is a workflow test, not production software.</div><div class="grid four">${[['Customers',db.customers.length],['Vehicles',db.vehicles.length],['Repair orders',db.orders.length],['Invoices',db.invoices.length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="grid two section">${box('Start a workflow',`<div class="actions">${btn('Vehicle intake',"go('Customers & Vehicles')",'primary')}${btn('New repair order',"go('Service')")}${btn('Inventory & sales',"go('Inventory & Sales')")}</div><p class="small" style="margin-top:20px">Vehicle → Customer → Service / Inventory → Parts → Invoice</p>`)}${box('Open repair orders',db.orders.map(o=>`<div class="line"><b>${esc(o.id)}</b> · ${esc(vlabel(o.vehicleId))}<br><span class="muted">${esc(o.work)} · ${esc(o.status)}</span></div>`).join('')||'<div class="empty">No orders</div>')}</div>`)}
function customers(){const rows=db.vehicles.map(v=>`<tr class="item" onclick="selectedVehicle='${v.id}';render()"><td>${esc(v.year+' '+v.make+' '+v.model)}</td><td>${esc(v.vin||'Not provided')}</td><td>${esc(customer(v.customerId)?.name||'Unlinked')}</td><td>${esc(v.purpose)}</td></tr>`).join('');const v=vehicle(selectedVehicle);return wrap('Customers & Vehicles','Start with a VIN or enter the vehicle manually; link a CRM customer.',`<div class="grid two">${box('Vehicle intake',`<div class="split">${formfield('VIN (optional)','vin')}${formfield('Year','year')}</div><div class="split">${formfield('Make','make')}${formfield('Model','model')}</div>${formfield('Engine / trim (optional)','engine')}<label>Linked customer<select id="cust">${options([{id:'',label:'Unlinked — attach later'},...db.customers.map(c=>({id:c.id,label:c.name}))],'')}</select></label><div class="actions">${btn('Save vehicle', 'addVehicle()','primary')}${btn('Add customer', 'showCustomerForm()')}</div><div id="customerForm" class="hidden section"><div class="split">${formfield('Customer name','cname')}${formfield('Phone','cphone')}</div>${formfield('Email','cemail')}${btn('Save customer','addCustomer()')}</div><p class="small">VIN decoding is not connected. Enter vehicle details manually in this first pass.</p>`)}${box('Selected vehicle',v?`<div class="metric">${esc(vlabel(v.id))}</div><p>VIN: ${esc(v.vin||'Not provided')}</p><p>Customer: ${esc(customer(v.customerId)?.name||'Unlinked')}</p><label>Attach / change customer<select id="linkcust">${options([{id:'',label:'Unlinked'},...db.customers.map(c=>({id:c.id,label:c.name}))],v.customerId)}</select></label>${btn('Save link','linkCustomer()','primary')}<div class="section"><b>Vehicle activity</b>${db.orders.filter(o=>o.vehicleId===v.id).map(o=>`<div class="line">${esc(o.id)} · ${esc(o.work)}</div>`).join('')||'<p>No service history yet.</p>'}</div>`:'<div class="empty">Select a vehicle below to see its customer and activity.</div>')}</div><div class="section">${box('Vehicle records',`<table><thead><tr><th>Vehicle</th><th>VIN</th><th>Customer</th><th>Purpose</th></tr></thead><tbody>${rows}</tbody></table>`)}</div>`)}
function showCustomerForm(){$('customerForm').classList.remove('hidden')}function addCustomer(){let name=$('cname').value.trim();if(!name)return message('Customer name required.');let c={id:'C-'+String(Date.now()).slice(-6),name,phone:$('cphone').value,email:$('cemail').value};db.customers.push(c);save();render();message('Customer saved. Select it in the intake form to link it.')}function addVehicle(){let vin=$('vin').value.trim().toUpperCase(),year=$('year').value.trim(),make=$('make').value.trim(),model=$('model').value.trim();if(!year||!make||!model)return message('Enter year, make and model.');if(vin&&db.vehicles.some(v=>v.vin===vin))return message('VIN already exists; select the existing vehicle.');let v={id:'V-'+String(Date.now()).slice(-6),vin,year,make,model,engine:$('engine').value,customerId:$('cust').value,miles:'',purpose:'Service'};db.vehicles.push(v);selectedVehicle=v.id;save();render();message('Vehicle saved and available across workflows.')}function linkCustomer(){let v=vehicle(selectedVehicle);if(!v)return;v.customerId=$('linkcust').value;save();render();message('Customer linked to vehicle.')}
function inventory(){return wrap('Inventory & Sales','Track stock and sales status; deal financing and title processing are not implemented.',`<div class="grid two">${box('Add vehicle to stock',`<label>Vehicle<select id="stockVehicle">${options(db.vehicles.map(v=>({id:v.id,label:vlabel(v.id)})))}</select></label>${formfield('Asking price ($)','stockPrice','','number')}${btn('Add to inventory','addStock()','primary')}`)}${box('Sales flow',`<div class="flow"><b>In stock</b><span>→</span><b>Reserved</b><span>→</span><b>Sold</b></div><p class="section small">Only status movement is modeled in this first pass.</p>`)}</div><div class="section">${box('Inventory',`<table><thead><tr><th>Stock</th><th>Vehicle</th><th>Price</th><th>Status</th><th>Change status</th></tr></thead><tbody>${db.inventory.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(vlabel(s.vehicleId))}</td><td>$${esc(s.price)}</td><td><span class="tag">${esc(s.status)}</span></td><td><select onchange="stockStatus('${s.id}',this.value)">${['Available','Reserved','Sold'].map(st=>`<option ${st===s.status?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`)}</div>`)}function addStock(){let id=$('stockVehicle').value,price=$('stockPrice').value;if(!id||!price)return message('Select a vehicle and enter price.');if(db.inventory.some(s=>s.vehicleId===id))return message('Vehicle already in inventory.');db.inventory.push({id:'ST-'+String(Date.now()).slice(-5),vehicleId:id,price,status:'Available'});save();render()}function stockStatus(id,s){db.inventory.find(x=>x.id===id).status=s;save();render()}
function service(){return wrap('Service Workspace','Create a repair order against an existing vehicle and move it through service.',`<div class="grid two">${box('New repair order',`<label>Vehicle<select id="roVehicle">${options(db.vehicles.map(v=>({id:v.id,label:vlabel(v.id)})))}</select></label>${formfield('Requested work','roWork')}<label>Assign technician<select id="roTech">${options([{id:'',label:'Unassigned'},...db.technicians.map(t=>({id:t.id,label:t.name}))])}</select></label>${btn('Create repair order','addOrder()','primary')}`)}${box('Service flow',`<div class="flow"><b>Requested</b><span>→</span><b>Authorized</b><span>→</span><b>In Progress</b><span>→</span><b>Ready</b><span>→</span><b>Closed</b></div><p class="small section">Technician assignment is simulated; scheduling, diagnostics and approvals are not implemented.</p>`)}</div><div class="section">${box('Repair orders',`<table><thead><tr><th>RO</th><th>Vehicle</th><th>Work</th><th>Technician</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(vlabel(o.vehicleId))}</td><td>${esc(o.work)}</td><td><select onchange="assignTech('${o.id}',this.value)">${options([{id:'',label:'Unassigned'},...db.technicians.map(t=>({id:t.id,label:t.name}))],o.technicianId||'')}</select></td><td><span class="tag">${esc(o.status)}</span></td><td><select onchange="orderStatus('${o.id}',this.value)">${['Requested','Authorized','In Progress','Ready','Closed'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`)}</div>`)}function addOrder(){let id=$('roVehicle').value,work=$('roWork').value.trim();if(!id||!work)return message('Select a vehicle and describe the work.');db.orders.push({id:'RO-'+String(Date.now()).slice(-5),vehicleId:id,customerId:vehicle(id).customerId,work,status:'Requested',technicianId:$('roTech').value});save();render()}function assignTech(id,t){db.orders.find(x=>x.id===id).technicianId=t;save();render()}function orderStatus(id,s){db.orders.find(x=>x.id===id).status=s;save();render()}
function parts(){return wrap('Parts & Glass','Connect a parts or glass request to a repair order.',`<div class="grid two">${box('New parts / glass request',`<label>Repair order<select id="partOrder">${options(db.orders.map(o=>({id:o.id,label:o.id+' — '+vlabel(o.vehicleId)})))}</select></label>${formfield('Part or glass description','partItem')}${btn('Add request','addPart()','primary')}`)}${box('Parts flow',`<div class="flow"><b>Requested</b><span>→</span><b>Ordered</b><span>→</span><b>Received</b><span>→</span><b>Installed</b></div><p class="small section">Supplier lookup, catalog data and ADAS calibration are not connected.</p>`)}</div><div class="section">${box('Requests',`<table><thead><tr><th>Request</th><th>Repair order</th><th>Item</th><th>Status</th></tr></thead><tbody>${db.parts.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.orderId)}</td><td>${esc(p.item)}</td><td><select onchange="partStatus('${p.id}',this.value)">${['Requested','Ordered','Received','Installed'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`)}</div>`)}function addPart(){let orderId=$('partOrder').value,item=$('partItem').value.trim();if(!orderId||!item)return message('Choose an order and describe the item.');db.parts.push({id:'P-'+String(Date.now()).slice(-5),orderId,item,status:'Requested'});save();render()}function partStatus(id,s){db.parts.find(x=>x.id===id).status=s;save();render()}
function invoices(){return wrap('Invoices & Payments','Draft invoices against repair orders; no real billing or payment processing.',`<div class="grid two">${box('New invoice draft',`<label>Repair order<select id="invoiceOrder">${options(db.orders.map(o=>({id:o.id,label:o.id+' — '+vlabel(o.vehicleId)})))}</select></label>${formfield('Amount ($)','invoiceAmount','','number')}${btn('Create draft','addInvoice()','primary')}`)}${box('Invoice flow',`<div class="flow"><b>Draft</b><span>→</span><b>Issued</b><span>→</span><b>Paid (demo)</b></div><p class="small section">Marking an invoice paid changes demo status only. No money moves.</p>`)}</div><div class="section">${box('Invoices',`<table><thead><tr><th>Invoice</th><th>Repair order</th><th>Amount</th><th>Status</th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td>${esc(i.id)}</td><td>${esc(i.orderId)}</td><td>$${esc(i.amount)}</td><td><select onchange="invoiceStatus('${i.id}',this.value)">${['Draft','Issued','Paid (demo)'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`)}</div>`)}function addInvoice(){let orderId=$('invoiceOrder').value,amount=$('invoiceAmount').value;if(!orderId||!amount||Number(amount)<=0)return message('Choose an order and enter a positive amount.');db.invoices.push({id:'INV-'+String(Date.now()).slice(-5),orderId,amount:Number(amount).toFixed(2),status:'Draft'});save();render()}function invoiceStatus(id,s){db.invoices.find(x=>x.id===id).status=s;save();render()}
function management(){return wrap('Management','High-level visibility only. Three sample technicians can be assigned to repair orders. No permissions, accounting or compliance systems.',`<div class="grid three">${[['Available stock',db.inventory.filter(s=>s.status==='Available').length],['Open repair orders',db.orders.filter(o=>o.status!=='Closed').length],['Unpaid invoices',db.invoices.filter(i=>i.status!=='Paid (demo)').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="section">${box('What this preview demonstrates','A single set of vehicle and customer records can drive inventory, service, parts and billing. Reports reflect changes to those same demo records. Technicians: '+(db.technicians.map(t=>t.name+' ('+db.orders.filter(o=>o.technicianId===t.id&&o.status!=='Closed').length+' open)').join(', ')||'None loaded')+'.')}</div>`)}render();
</script></body></html>

<!doctype html><html><head><base target="_top"><style>body{font:14px system-ui;background:#0d1727;color:#fff;padding:12px}button{background:#d5ad66;border:0;padding:10px;border-radius:7px;margin:5px}textarea{width:100%;height:230px;background:#182941;color:white;box-sizing:border-box}</style></head><body><h3>Chapple Works Storage</h3><p>Private cloud snapshot in this Google Sheet.</p><p id="status">Ready</p><button onclick="load()">Load cloud data</button><button onclick="save()">Save to cloud</button><textarea id="payload" placeholder="Paste the unified Chapple Works backup JSON here"></textarea><script>
const q=document.getElementById('payload'),s=document.getElementById('status');
function load(){s.textContent='Loading';google.script.run.withSuccessHandler(x=>{q.value=JSON.stringify({format:'cw-backup-v03',dashboard:x.dashboard,catalog:x.catalog},null,2);s.textContent=x.dashboard?'Loaded':'Empty: paste a unified backup to initialize'}).withFailureHandler(e=>s.textContent=e.message).readState()}
function save(){try{const x=JSON.parse(q.value);if(!confirm('Replace cloud snapshots?'))return;s.textContent='Saving';google.script.run.withSuccessHandler(t=>s.textContent=t).withFailureHandler(e=>s.textContent=e.message).saveState(x)}catch(e){s.textContent=e.message}}
load();</script></body></html>
